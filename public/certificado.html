<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Certificado</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="site">
    <div class="container">
      <a class="brand" href="/">📘 VT LB</a>
      <nav><a href="/premio">🎁 Resgatar prêmio</a></nav>
    </div>
  </header>

  <main>
    <div class="container">
      <div id="error" class="alert error hidden"></div>

      <div id="certificate" class="certificate hidden">
        <p class="muted" style="text-transform:uppercase;letter-spacing:.2em">Certificado</p>
        <h1 class="title">de Aquisição</h1>
        <p style="margin-top:28px">Certificamos que</p>
        <div class="holder" id="holder"></div>
        <p>adquiriu o ebook <strong id="ebook"></strong><br>em <span id="date"></span>.</p>
        <p style="margin-top:28px" class="muted">Código do certificado</p>
        <p class="code" id="code"></p>
      </div>

      <div class="center no-print" style="margin-top:24px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
        <button class="btn" onclick="window.print()">Imprimir / salvar em PDF</button>
        <a class="btn secondary" id="prize-link" href="/premio">Resgatar meu prêmio</a>
      </div>
    </div>
  </main>

  <script src="/js/common.js"></script>
  <script>
    const code = decodeURIComponent(location.pathname.split('/').pop());
    api(`/api/certificates/${encodeURIComponent(code)}`)
      .then((cert) => {
        document.getElementById('holder').textContent = cert.name;
        document.getElementById('ebook').textContent = cert.ebookTitle;
        document.getElementById('date').textContent =
          new Date(cert.issuedAt.replace(' ', 'T') + 'Z').toLocaleDateString('pt-BR', { day: '2-digit', month: 'long', year: 'numeric' });
        document.getElementById('code').textContent = cert.code;
        document.getElementById('prize-link').href = `/premio?codigo=${encodeURIComponent(cert.code)}`;
        document.getElementById('certificate').classList.remove('hidden');
      })
      .catch((err) => showError(document.getElementById('error'), err.message));
  </script>
</body>
</html>
